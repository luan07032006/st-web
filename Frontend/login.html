    <section class="login-card" aria-labelledby="login-title">
      <span class="eyebrow">MỘT GÓC NHỎ ĐỂ HỌC ĐIỀU HAY</span>
      <h1 id="login-title">Chào mừng đến với<br>Lớp học cô Quỳnh Hương!</h1>
      <p class="intro">Cùng bắt đầu một bài học mới nhé.</p>
      <form id="loginForm">
        <div class="input-wrap username-wrap">
          <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="10" r="5"/><path d="M6 27V25C6 16 26 16 26 25V27"/></svg></span>
          <div class="field"><label for="username">Tên đăng nhập</label><input id="username" name="username" autocomplete="username" placeholder="Nhập tên đăng nhập" required spellcheck="false" autocapitalize="none"></div>
        </div>
        <div class="input-wrap password-wrap">
          <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="13" width="20" height="16" rx="3"/><path d="M10 13V9A6 6 0 0 1 22 9V13"/><circle cx="16" cy="20" r="1.5" fill="currentColor" stroke="none"/><path d="M16 21V24"/></svg></span>
          <div class="field"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required></div>
          <button class="password-toggle" id="togglePassword" type="button" aria-label="Hiện mật khẩu" aria-pressed="false">◉</button>
        </div>
        <p id="loginError" class="error" role="alert" hidden></p>
        <button class="login-button" type="submit">Đăng nhập ngay <span aria-hidden="true">→</span></button>
      </form>
      <p class="footer-note">✧ Không gian dạy học của cô Quỳnh Hương ✧</p>
    </section>
    <p class="page-note">Mỗi bài học là một chút cảm hứng mới.</p>
  </main>
</body>
</html>
